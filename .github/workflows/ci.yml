name: EcoTrack CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ecotrack_test
          MYSQL_USER: ecotrack_test
          MYSQL_PASSWORD: ecotrack_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: mysql://ecotrack_test:ecotrack_test_password@127.0.0.1:3306/ecotrack_test
      DATABASE_SSL: "false"
      SESSION_SECRET: "ci-integration-session-secret-minimum-32-characters-long"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript checks
        run: npm run lint

      - name: Run production build
        run: npm run build

      - name: Run MySQL migrations
        run: npm run db:migrate

      - name: Run idempotent seed script
        run: npm run db:seed

      - name: Run unit and MySQL/Auth integration tests
        run: npm test
